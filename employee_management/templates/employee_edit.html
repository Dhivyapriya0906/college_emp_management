<!DOCTYPE html>
<html>
<head>
    <title>Edit Employee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">


<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header text-white" style="background:#1E3A8A;">
            <h3 class="text-center">
                Edit Employee
            </h3>
        </div>


        <div class="card-body">


            <form method="POST">

                {% csrf_token %}


                <div class="mb-3">

                    <label>Employee Name</label>

                    <input type="text"
                           class="form-control"
                           name="emp_name"
                           value="{{ employee.emp_name }}">

                </div>


                <div class="mb-3">

                    <label>Mobile Number</label>

                    <input type="text"
                           class="form-control"
                           name="mobile_no"
                           value="{{ employee.mobile_no }}">

                </div>


                <div class="mb-3">

                    <label>Email</label>

                    <input type="email"
                           class="form-control"
                           name="email"
                           value="{{ employee.email }}">

                </div>


                <div class="mb-3">

                    <label>Employee Type</label>

                    <select class="form-select" name="employee_type">

                        <option>{{ employee.employee_type }}</option>
                        <option>Technical</option>
                        <option>Non Technical</option>

                    </select>

                </div>


                <div class="mb-3">

                    <label>Employee Shift</label>

                    <select class="form-select" name="employee_shift">

                        <option>{{ employee.employee_shift }}</option>
                        <option>Regular</option>
                        <option>Shift</option>

                    </select>

                </div>


                <div class="text-center">

                    <button class="btn btn-success">
                        Update Employee
                    </button>


                    <a href="{% url 'employee_list' %}"
                       class="btn btn-secondary">

                        Cancel

                    </a>


                </div>


            </form>


        </div>

    </div>

</div>


</body>
</html>
