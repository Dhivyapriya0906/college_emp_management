{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Delete Leave</title>
    <link rel="stylesheet" href="{% static 'leave_management/css/style.css' %}">
</head>

<body>
<div class="container">
    <div class="card">

        <h2>Delete Leave</h2>

        <p>Are you sure you want to delete this leave request?</p>

        <form method="POST">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Yes, Delete
            </button>

            <a href="{% url 'leave_list' %}" class="btn btn-primary">
                Cancel
            </a>

        </form>

    </div>
</div>
</body>
</html>
